[project]
name = "tarkon"
version = "0.1.0"
description = "Team board of Jira epics and GitHub PRs, in the terminal or the browser."
requires-python = ">=3.12"
dependencies = ["textual>=8.2", "textual-image>=0.14", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tarkon = "tarkon.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tarkon", "tarkon.tui", "tarkon.html"]

[tool.setuptools.package-data]
tarkon = ["logo.png"]
"tarkon.tui" = ["app.tcss"]
"tarkon.html" = ["template.html"]
