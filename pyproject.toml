[project]
name = "magi"
version = "0.4.1"
description = "Team board of Jira epics and GitHub PRs, in the terminal."
requires-python = ">=3.12"
dependencies = ["textual>=8.2", "textual-image>=0.14", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
magi = "magi.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["magi", "magi.adapters", "magi.application", "magi.domain", "magi.tui"]

[tool.setuptools.package-data]
magi = ["logo.png", "logo-black.png", "logo-white.png"]
"magi.tui" = ["app.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
