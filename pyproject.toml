[project]
name = "magi"
version = "0.12.0"
description = "Team board of Jira epics and GitHub PRs, in the terminal."
requires-python = ">=3.12"
dependencies = ["textual>=8.2", "textual-image>=0.14", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
magi = "magi.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["magi", "magi.adapters", "magi.application", "magi.domain", "magi.tui"]

[tool.setuptools.package-data]
magi = ["logo.png", "logo-black.png", "logo-white.png"]
"magi.tui" = ["app.tcss", "web.html", "web.css", "fonts/antonio.woff2", "fonts/OFL.txt", "fonts/dseg7.woff2", "fonts/DSEG-LICENSE.txt",
               "fonts/rajdhani-500.woff2", "fonts/rajdhani-700.woff2", "fonts/RAJDHANI-LICENSE.txt",
               "fonts/hubot-sans-700.woff2", "fonts/HUBOT-SANS-LICENSE.txt", "fonts/monaspace-neon-400.woff2", "fonts/monaspace-neon-700.woff2",
               "fonts/MONASPACE-LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
